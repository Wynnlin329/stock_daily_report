name: Daily Health Check

on:
  schedule:
    - cron: "55 15 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  health-check:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Taipei
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Validate and incrementally bootstrap market history
        run: |
          python scripts/bootstrap_history.py \
            --trading-days 260 \
            --max-calendar-days 420 \
            --no-include-institutional \
            --no-include-margin-short \
            --skip-index \
            --skip-mops \
            --require-complete

      - name: Generate health check
        run: python scripts/run_health_check.py

      - name: Validate generated artifacts
        run: python scripts/validate_generated_artifacts.py --minimum-history-days 252

      - name: Commit generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json latest.md history/ data/ reports/
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          REPORT_DATE="$(python -c 'import json; print(json.load(open("latest.json", encoding="utf-8"))["report_date"])')"
          git commit -m "daily stock health check ${REPORT_DATE}"
          git push
