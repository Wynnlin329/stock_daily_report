name: Bootstrap History

on:
  workflow_dispatch:
    inputs:
      trading_days:
        description: "Number of trading days to backfill"
        required: false
        default: "60"
      max_calendar_days:
        description: "Maximum natural days to scan backward"
        required: false
        default: "180"
      mops_calendar_days:
        description: "Number of natural days to backfill MOPS events"
        required: false
        default: "90"
      include_mops_backfill:
        description: "Opt in to low-frequency MOPS event backfill"
        required: false
        default: "false"
      mops_max_dates_per_run:
        description: "Maximum MOPS dates to request per run when backfill is enabled"
        required: false
        default: "5"

permissions:
  contents: write

jobs:
  bootstrap-history:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Taipei
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Bootstrap history
        run: |
          MOPS_BACKFILL_ARGS=""
          if [ "${{ inputs.include_mops_backfill }}" = "true" ]; then
            MOPS_BACKFILL_ARGS="--include-mops-backfill --mops-max-dates-per-run ${{ inputs.mops_max_dates_per_run }}"
          fi
          python scripts/bootstrap_history.py \
            --trading-days "${{ inputs.trading_days }}" \
            --max-calendar-days "${{ inputs.max_calendar_days }}" \
            --include-institutional \
            --include-margin-short \
            --mops-calendar-days "${{ inputs.mops_calendar_days }}" \
            ${MOPS_BACKFILL_ARGS}

      - name: Commit generated history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history-index.json data/latest-listed-ohlcv.csv data/latest-otc-ohlcv.csv data/latest-institutional-trading.csv data/latest-institutional-trading-summary.json data/latest-margin-short.csv data/latest-margin-short-summary.json data/latest-mops-events.json data/latest-mops-events.csv data/market/ data/institutional/ data/margin_short/ data/mops/
          if git diff --cached --quiet; then
            echo "No generated history changes to commit."
            exit 0
          fi
          git commit -m "bootstrap stock history ${{ inputs.trading_days }} trading days"
          git push
